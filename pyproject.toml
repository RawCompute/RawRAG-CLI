[project]
name = "rawrag-cli"
version = "0.1.0"
description = "A local, zero-dependency RAG CLI tool for codebase indexing and retrieval"
readme = "README.md"
authors = [
    { name = "Prabal Singh", email = "prabalpsingh2429@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "pyfiglet>=1.0.0",
    "pypdf2>=3.0.0",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "sentence-transformers>=2.2.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2>=5.0.0",
    "rapidocr>=3.0.0",
]

[project.scripts]
rawrag = "rawrag_cli.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
